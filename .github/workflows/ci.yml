# Areas 1-7, 9-11. Deterministic gates first, then those needing a registry, then
# those needing infrastructure. Rollout order follows CI_GATES.md section 6.
name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for every job (SECURITY.md 8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace and lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Structure gate
        run: pnpm run check:structure

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{ts,tsx,mjs,json,css,md}"
      - name: ESLint (packages and applications)
        run: pnpm lint
      # scripts/ and tests/ live outside every package's src/, so the per-package
      # lint task cannot see them. Without this step, dead code in the gate scripts
      # itself ships unnoticed - which is exactly what happened.
      - name: ESLint (scripts, gates, and end-to-end suites)
        run: pnpm run lint:repo

  typecheck:
    name: TypeScript type safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  governance:
    name: Governance and documentation compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Documents, ADRs, exceptions, and claim checks
        run: pnpm run check:docs

  boundaries:
    name: Dependency boundaries and contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import matrix and cycle detection
        run: pnpm run check:boundaries
      - name: Single-source-of-truth enforcement
        run: pnpm run check:contracts

  ci-integrity:
    name: Pipeline integrity (false-green prevention)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No swallowed failures in any workflow
        run: pnpm run check:ci

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tracked files and full history
        run: pnpm run check:secrets

  workflow-security:
    name: Workflow security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Least privilege and injection checks
        run: pnpm run check:workflows

  dependency-audit:
    name: Dependency vulnerability and licence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block high and critical vulnerabilities
        run: pnpm audit --audit-level high
      - name: Report licence inventory
        run: pnpm licenses list --prod --json > licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licence-inventory
          path: licenses.json

  build:
    name: Production build integrity
    runs-on: ubuntu-latest
    needs: [workspace, lint, typecheck]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every package and application
        run: pnpm build
      - name: Assert no environment file reached the build context
        run: |
          if [ -f .env ]; then
            echo "FAIL a .env file is present in the build context"
            exit 1
          fi
          echo "ok no .env in the build context"

  test:
    name: Unit, contract, and integration tests
    runs-on: ubuntu-latest
    needs: [workspace]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: Critical end-to-end journeys
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The whole dependency graph, not just the web app: a clean checkout has no
      # compiled output for the shared packages.
      - name: Build every package and application
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the critical journeys against a production build
        run: pnpm test:e2e
      # Uploads diagnostics when the journeys fail. `!cancelled()` rather than
      # `always()`: the job still fails on a failing test suite, and the
      # false-green gate (CI_GATES.md area 11) rejects `always()` because it
      # cannot distinguish "failed" from "cancelled".
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  a11y:
    name: Accessibility audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every package and application
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Zero serious or critical axe violations
        run: pnpm test:a11y

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    needs: [workspace]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma's MongoDB connector requires a replica set for transactions, and a
      # standalone server is not sufficient. The job fails rather than skips when the
      # database is unavailable (TESTING.md section 4a).
      - name: Install MongoDB
        env:
          # Pinned so the test database cannot change under a green run. The apt
          # repository does not publish a build for Ubuntu 24.04 (noble) on the 7.0
          # line, which is why the official tarball is used rather than a package.
          MONGODB_VERSION: '7.0.29'
        run: |
          set -euo pipefail
          archive="mongodb-linux-x86_64-ubuntu2204-${MONGODB_VERSION}.tgz"
          curl -fsSL "https://downloads.mongodb.org/linux/${archive}" -o /tmp/mongodb.tgz
          mkdir -p /tmp/mongodb
          tar -xzf /tmp/mongodb.tgz -C /tmp/mongodb --strip-components=1
          echo "/tmp/mongodb/bin" >> "$GITHUB_PATH"
          reported="$(/tmp/mongodb/bin/mongod --version | head -1)"
          echo "installed: ${reported}"
          case "${reported}" in
            *"v${MONGODB_VERSION}"*) ;;
            *) echo "FAIL expected mongod v${MONGODB_VERSION}, got: ${reported}"; exit 1 ;;
          esac
      - name: Run integration tests against an ephemeral replica set
        run: pnpm db:integration
